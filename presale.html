<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOIN Token Presale</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 {
            color: #F3BA2F;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .info-box {
            background: #334155;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
            font-size: 14px;
        }
        .info-box p {
            margin: 8px 0;
        }
        /* Tombol Connect Wallet Responsif & Besar */
        .wallet-wrapper {
            width: 100%;
            margin-top: 20px;
        }
        #connectBtn {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #000000;
            background-color: #F3BA2F;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.3s;
        }
        #connectBtn:hover {
            background-color: #e2ab25;
        }
        #status {
            margin-top: 12px;
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>VOIN Presale</h1>
        <p>Bergabunglah dengan presale token VOIN di BNB Smart Chain.</p>

        <div class="info-box">
            <p><strong>Jaringan:</strong> BNB Smart Chain (Chain ID: 56)</p>
            <p><strong>Harga Batch 1:</strong> 0.001 BNB / VOIN</p>
            <p><strong>Status Dompet:</strong> <span id="walletAddress">Belum Terhubung</span></p>
        </div>

        <!-- Tombol dan Status Koneksi -->
        <div class="wallet-wrapper">
            <button id="connectBtn" onclick="connectWallet()">Connect Wallet</button>
            <div id="status">Status: Silakan hubungkan dompet MetaMask Anda</div>
        </div>
    </div>

    <!-- Script Koneksi Wallet -->
    <script>
        async function connectWallet() {
            const statusDiv = document.getElementById("status");
            const addressSpan = document.getElementById("walletAddress");

            // Cek apakah MetaMask terinstal atau dibuka di browser MetaMask
            if (typeof window.ethereum !== 'undefined') {
                try {
                    statusDiv.innerText = "Status: Menghubungkan ke MetaMask...";
                    
                    // Minta izin akun
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const account = accounts[0];

                    // Cek Chain ID (harus 56 / 0x38 untuk BSC)
                    const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                    if (chainId !== '0x38') {
                        try {
                            // Coba pindah jaringan otomatis ke BSC
                            await window.ethereum.request({
                                method: 'wallet_switchEthereumChain',
                                params: [{ chainId: '0x38' }],
                            });
                        } catch (switchError) {
                            statusDiv.innerText = "Status: Harap pindah manual ke jaringan BNB Smart Chain di MetaMask.";
                            return;
                        }
                    }

                    // Tampilkan alamat dompet yang terhubung (disingkat)
                    const shortenedAddress = account.substring(0, 6) + "..." + account.substring(account.length - 4);
                    addressSpan.innerText = shortenedAddress;
                    statusDiv.innerText = "Status: Berhasil terhubung ke MetaMask!";
                    document.getElementById("connectBtn").innerText = "Connected";

                } catch (error) {
                    console.error(error);
                    statusDiv.innerText = "Status: Koneksi dibatalkan oleh pengguna.";
                }
            } else {
                // Fitur Deep Link jika dibuka di Chrome/Browser biasa
                statusDiv.innerText = "Status: Membuka aplikasi MetaMask...";
                const dappUrl = window.location.href.replace(/^https?:\/\//, '');
                window.location.href = `https://metamask.app.link/dapp/${dappUrl}`;
            }
        }
    </script>
</body>
</html>
