<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOIN Presale - BNB Smart Chain</title>
    <style>
        :root {
            --primary-color: #10b981;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        h1 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 24px;
            text-align: center;
        }
        p {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .info-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .info-box p {
            text-align: left;
            margin: 8px 0;
            color: var(--text-color);
        }
        .wallet-wrapper {
            text-align: center;
        }
        #connectBtn {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        #connectBtn:hover {
            background-color: #059669;
        }
        #status {
            margin-top: 15px;
            font-size: 13px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>VOIN Presale</h1>
        <p>Bergabunglah dengan presale token VOIN di BNB Smart Chain.</p>

        <div class="info-box">
            <p><strong>Jaringan:</strong> BNB Smart Chain (Chain ID: 56)</p>
            <p><strong>Harga Batch 1:</strong> 0.001 BNB / VOIN</p>
            <p><strong>Status Dompet:</strong> <span id="walletAddress">Belum Terhubung</span></p>
        </div>

        <div class="wallet-wrapper">
            <button id="connectBtn" onclick="connectWallet()">Connect Wallet</button>
            <div id="status">Status: Silakan hubungkan dompet Anda</div>
        </div>
    </div>

    <!-- Pustaka Ethers.js untuk menangani koneksi provider Web3 secara universal -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script>
        async function connectWallet() {
            const statusDiv = document.getElementById("status");
            const addressSpan = document.getElementById("walletAddress");
            const connectBtn = document.getElementById("connectBtn");

            // Mengecek provider injeksi Web3 universal (MetaMask, Trust Wallet, dApp Browser, dll)
            if (typeof window.ethereum !== 'undefined') {
                try {
                    statusDiv.innerText = "Status: Menghubungkan ke dompet...";
                    
                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    const signer = provider.getSigner();
                    const userAddress = await signer.getAddress();

                    // Periksa apakah berada di BNB Smart Chain (Chain ID: 56)
                    const network = await provider.getNetwork();
                    if (network.chainId !== 56) {
                        alert("Peringatan: Jaringan Anda bukan BNB Smart Chain (Chain ID: 56). Harap ubah jaringan di dompet Anda.");
                    }

                    statusDiv.innerText = "Status: Berhasil Terhubung";
                    addressSpan.innerText = userAddress.substring(0, 6) + "..." + userAddress.substring(userAddress.length - 4);
                    connectBtn.innerText = "Connected";
                    connectBtn.style.backgroundColor = "#047857";

                } catch (error) {
                    console.error(error);
                    statusDiv.innerText = "Status: Koneksi dibatalkan oleh pengguna.";
                }
            } else {
                statusDiv.innerText = "Status: Tidak ada dompet terdeteksi.";
                alert("Dompet kripto tidak terdeteksi! Pastikan Anda membukanya melalui browser di dalam aplikasi dompet (seperti MetaMask atau Trust Wallet).");
            }
        }
    </script>
</body>
</html>
